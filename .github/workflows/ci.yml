name: Intelligent Software Defect Tracking System CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  # ==========================================
  # BACKEND - TESTS AND VALIDATION
  # ==========================================
  backend:
    name: Backend Tests and Validation
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:

      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install backend dependencies
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      # Wait until MongoDB is ready
      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            nc -z 127.0.0.1 27017 && echo "MongoDB is ready!" && exit 0
            echo "Waiting for MongoDB..."
            sleep 2
          done

          echo "MongoDB failed to start"
          exit 1

      # Run Jest tests
      - name: Run Automated Tests
        working-directory: ./backend
        env:
          JWT_SECRET: test-secret-key
          MONGO_URI: mongodb://127.0.0.1:27017/bugtrack_test
        run: npm test

      # Run backend build if available
      - name: Validate Backend
        working-directory: ./backend
        run: npm run build --if-present


  # ==========================================
  # FRONTEND - BUILD AND VALIDATION
  # ==========================================
  frontend:
    name: Frontend Build and Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:

      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies
      - name: Install Frontend Dependencies
        run: npm ci

      # Build React/Vite application
      - name: Build Frontend
        run: npm run build